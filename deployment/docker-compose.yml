version: "3.9"

services:

  backend:
    build:
      context: ./backend
    container_name: loanai-backend
    ports:
      - "5000:5000"
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: loanai-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always
