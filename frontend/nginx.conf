server {
listen 80;

```
location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri /index.html;
}

location /predict {
    proxy_pass https://loan-ai.onrender.com;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
